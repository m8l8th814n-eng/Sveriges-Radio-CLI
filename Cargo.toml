[package]
name = "srtui"
version = "0.1.0"
edition = "2024"

[lib]
name = "srtui"
path = "src/lib.rs"

[[bin]]
name = "srtui"
path = "src/bin/srtui.rs"

[dependencies]
anyhow = "1"
cpal = "0.16"
crossterm = "0.29"
minimp3 = "0.6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
